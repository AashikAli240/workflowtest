name: Scheduled Job

on:
  schedule:
    # Ejecuta cada día a las 03:00 AM UTC
    - cron: "0 3 * * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  run-scheduled-task:
    runs-on: ubuntu-latest

    steps:
   
      - name: Print message
        run: |
          echo "Schedule workflow Excuted..."
          date
          # Aquí puedes poner tu script, comando o pipeline
